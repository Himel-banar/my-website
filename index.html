<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Himel Ahammed - Official Links</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f0f;color:#fff;display:flex;justify-content:center;padding:20px}
.container{width:100%;max-width:400px}
.card{background:#1a1a1a;border-radius:25px;padding:25px;text-align:center;position:relative;border:1px solid #222}
.admin-btn{position:absolute;top:15px;right:15px;background:#2a2a2a;border:none;color:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px}
.avatar{width:90px;height:90px;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold;margin:25px auto 15px;border:2px solid #333}
.name{font-size:26px;font-weight:bold;color:#d8a0ff;text-shadow:0 0 10px #a855f7;margin-bottom:5px}
.bio{color:#888;font-size:13px;margin-bottom:22px;line-height:1.5}
.link{background:#242424;border-radius:12px;padding:12px;display:flex;align-items:center;margin-bottom:12px;text-decoration:none;color:#fff}
.link:hover{background:#2f2f2f}
.icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-right:12px;font-size:20px;font-weight:bold}
.fb{background:#1877F2} .yt{background:#FF0000} .tk{background:#000} .wa{background:#25D366}
.link-text{text-align:left;flex:1}
.link-text b{font-size:15px} .link-text span{font-size:12px;color:#888;display:block;margin-top:2px}
.arrow{color:#555;font-size:22px}
.footer{margin-top:18px;font-size:11px;color:#555}
.gallery-card{background:#1a1a1a;border-radius:20px;padding:15px;margin-top:15px;border:1px solid #222}
.gallery-card h3{font-size:16px;margin-bottom:12px;text-align:left}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g-item{position:relative;border-radius:12px;overflow:hidden;height:140px;background:#222}
.g-item img{width:100%;height:100%;object-fit:cover}
.del{position:absolute;top:6px;right:6px;background:red;border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;display:none;font-weight:bold}
.g-item.admin .del{display:block}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <button class="admin-btn" onclick="adminLogin()">👤 Admin</button>
    <div class="avatar">H</div>
    <div class="name">Himel Ahammed</div>
    <div class="bio">Music Lover<br>All my official links in one place</div>

    <a href="https://facebook.com" target="_blank" class="link"><div class="icon fb">f</div><div class="link-text"><b>Facebook</b><span>Himel Ahammed • Follow Me</span></div><div class="arrow">›</div></a>
    <a href="https://youtube.com" target="_blank" class="link"><div class="icon yt">▶</div><div class="link-text"><b>YouTube</b><span>Himel Islamic400 • Subscribe</span></div><div class="arrow">›</div></a>
    <a href="https://tiktok.com" target="_blank" class="link"><div class="icon tk">♫</div><div class="link-text"><b>TikTok</b><span>@remix.music400 • Follow</span></div><div class="arrow">›</div></a>
    <a href="https://wa.me/8801938250868" target="_blank" class="link"><div class="icon wa">W</div><div class="link-text"><b>WhatsApp</b><span>01938-250868 • Message Me</span></div><div class="arrow">›</div></a>

    <div class="footer">Developer Himel • 2026</div>
  </div>

  <div class="gallery-card">
    <h3>📸 My Gallery</h3>
    <div class="gallery" id="gallery"></div>
    <div id="adminPanel" style="display:none;margin-top:12px;">
      <button onclick="addImage()" style="width:100%;padding:11px;background:#a855f7;border:none;border-radius:10px;color:white;cursor:pointer;font-weight:bold;">+ Add Photo</button>
      <p style="font-size:10px;color:#00ff88;margin-top:6px;text-align:center;">✅ Admin Mode ON</p>
    </div>
  </div>
</div>

<script>
let isAdmin = false;
const ADMIN_PASS = "J@hidul)";

function adminLogin(){
  let p = prompt("Admin Password দাও:");
  if(p === ADMIN_PASS){
    isAdmin = true;
    document.getElementById('adminPanel').style.display='block';
    renderGallery();
    alert("✅ Admin Login Success! এখন তুমি ছবি Add/Delete করতে পারবে");
  } else if(p !== null){
    alert("❌ Wrong Password!");
  }
}

function getImages(){
  return JSON.parse(localStorage.getItem('himelGallery') || '[]');
}

function renderGallery(){
  const gallery = document.getElementById('gallery');
  const images = getImages();
  gallery.innerHTML = '';
  if(images.length === 0 && !isAdmin){
    gallery.innerHTML = '<p style="grid-column:span 2;color:#555;font-size:12px;padding:20px;">No photos yet</p>';
    return;
  }
  images.forEach((img, i)=>{
    gallery.innerHTML += `<div class="g-item ${isAdmin?'admin':''}"><img src="${img}"><button class="del" onclick="deleteImage(${i})">✕</button></div>`;
  });
}

function addImage(){
  if(!isAdmin) return alert("Only Admin!");
  let url = prompt("ছবির Direct Link দাও:\n(Google থেকে ছবির লিংক কপি করো)");
  if(url && url.trim() !== ""){
    let images = getImages();
    images.push(url.trim());
    localStorage.setItem('himelGallery', JSON.stringify(images));
    renderGallery();
  }
}

function deleteImage(i){
  if(!isAdmin) return alert("Only Admin can delete!");
  if(!confirm("এই ছবিটা ডিলেট করবে?")) return;
  let images = getImages();
  images.splice(i,1);
  localStorage.setItem('himelGallery', JSON.stringify(images));
  renderGallery();
}

renderGallery();
</script>
</body>
</html>
